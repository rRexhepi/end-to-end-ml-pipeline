[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "data", "models", "predictions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
